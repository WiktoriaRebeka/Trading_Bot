# ZASTĄP CAŁĄ ZAWARTOŚĆ PLIKU

name: Deploy Data Collector to Cloud Run

on:
  push:
    branches:
      - div # lub main, w zależności od Twojej gałęzi produkcyjnej
    paths:
      - 'data_collector.py'
      - 'collector_main.py'
      - 'Dockerfile' # Upewnij się, że ta nazwa jest poprawna
      - 'requirements.txt'
      - 'constants.py'
      - 'firebase_client.py'
      - 'config_loader.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # ### POPRAWKA: USUNIĘTO BŁĘDNY KROK ZMIANY NAZWY ###
      # - name: Adjust Dockerfile name for Collector
      #   run: mv Dockerfile.collector Dockerfile

      - name: Build and push image to Google Artifact Registry
        run: |-
          gcloud builds submit --tag europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trading-bot-image/data-collector-service:latest --file Dockerfile

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy data-collector-service \
            --image europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trading-bot-image/data-collector-service:latest \
            --region europe-central2 \
            --platform managed \
            --allow-unauthenticated