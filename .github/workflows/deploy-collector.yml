name: Deploy Data Collector to Cloud Run

on:
  push:
    branches:
      - div
    paths:
      - '.github/workflows/deploy-collector.yml'
      - 'cloudbuild-collector.yaml'
      - 'collector_service/**'
      - 'shared_lib/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot_service/requirements.txt
          pip install -r collector_service/requirements.txt

      - name: Run tests with pytest
        run: |
          export PYTHONPATH=.
          pytest

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # --- POPRAWIONY KROK ---
      - name: Build and push image via Cloud Build
        run: |-
          gcloud builds submit . --config=cloudbuild-collector.yaml \
            --service-account=service-785819958951@gcp-sa-cloudbuild.iam.gserviceaccount.com \
            --logging=CLOUD_LOGGING_ONLY

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy data-collector-service \
            --image europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trading-bot-image/data-collector-service:latest \
            --region europe-central2 \
            --platform managed \
            --allow-unauthenticated \
            --service-account trading-bot-463318@appspot.gserviceaccount.com