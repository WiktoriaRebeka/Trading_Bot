name: Deploy Data Collector to Cloud Run
on:
  push:
    branches: [div]
    paths:
      - '.github/workflows/deploy-collector.yml'
      - 'collector_main.py'
      - 'data_collector.py'
      - 'Dockerfile.collector'
      - 'constants.py'
      - 'firebase_client.py'
jobs:
  deploy-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      # id-token NIE jest potrzebne dla starej metody
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- POCZĄTEK KLUCZOWEJ ZMIANY: Kopiujemy działającą metodę ---
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1' # Wersja v1, tak jak w działającym bocie
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}' # Używamy tego samego, sprawdzonego sekretu

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1' # Wersja v1, tak jak w działającym bocie
      # --- KONIEC KLUCZOWEJ ZMIANY ---
      
      - name: Prepare Dockerfile for build
        run: mv Dockerfile.collector Dockerfile

      - name: Build and Push Collector Image
        run: gcloud builds submit --tag europe-central2-docker.pkg.dev/trading-bot-463318/trading-bot-image/data-collector-service:latest .
      
      - name: Revert Dockerfile name (optional cleanup)
        if: always()
        run: mv Dockerfile Dockerfile.collector

      - name: Deploy Collector to Cloud Run
        run: |-
          gcloud run deploy data-collector-service \
            --image europe-central2-docker.pkg.dev/trading-bot-463318/trading-bot-image/data-collector-service:latest \
            --region europe-central2 \
            --allow-unauthenticated \
            --vpc-connector app-connector-warsaw \
            --vpc-egress all