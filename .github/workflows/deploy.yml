name: Deploy Trading Bot to Cloud Run

on:
  push:
    branches:
      - div
    # Opcjonalna optymalizacja: dodajemy filtry, aby nie uruchamiać go bez potrzeby
    paths:
      - '.github/workflows/deploy.yml'
      - 'main.py'
      - 'bot_logic.py'
      - 'Dockerfile.bot' # <-- ZMIANA NAZWY
      - 'firebase_client.py'
      - 'constants.py'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        # Sugeruję zmianę na bezpieczniejszą metodę WIF, ale na razie zostawiam
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: Build and Push Docker image
        run: |-
          gcloud auth configure-docker europe-central2-docker.pkg.dev
          # --- NAJWAŻNIEJSZA ZMIANA ---
          # Jawnie wskazujemy plik Dockerfile.bot i dodajemy kropkę na końcu
          gcloud builds submit --tag europe-central2-docker.pkg.dev/trading-bot-463318/trading-bot-image/trading-bot-service:latest --file Dockerfile.bot .

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy trading-bot-service \
            --image europe-central2-docker.pkg.dev/trading-bot-463318/trading-bot-image/trading-bot-service:latest \
            --region europe-central2 \
            --allow-unauthenticated \
            --vpc-connector app-connector-warsaw \
            --vpc-egress all