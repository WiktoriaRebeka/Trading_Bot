name: Deploy Trading Bot to Cloud Run

on:
  push:
    branches:
      - div

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}' # Używamy starej, sprawdzonej metody

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: Build and Push Docker image
        run: |-
          gcloud auth configure-docker europe-central2-docker.pkg.dev
          gcloud builds submit --tag europe-central2-docker.pkg.dev/trading-bot-463318/trading-bot-image/trading-bot-service:latest

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy trading-bot-service \
            --image europe-central2-docker.pkg.dev/trading-bot-463318/trading-bot-image/trading-bot-service:latest \
            --region europe-central2 \
            --allow-unauthenticated \
            --vpc-connector app-connector-warsaw \
            --vpc-egress all