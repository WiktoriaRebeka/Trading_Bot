# Pełna zawartość pliku: .github/workflows/deploy.yml

name: Deploy Trading Bot to Cloud Run

on:
  push:
    branches:
      - div
    paths:
      # Ścieżki, które wyzwalają to wdrożenie
      - '.github/workflows/deploy.yml'
      - 'cloudbuild-bot.yaml'
      - 'main.py'
      - 'bot_logic.py'
      - 'Dockerfile.bot'
      - 'bigquery_logger.py'
      - 'config_loader.py'
      - 'constants.py'
      - 'fetch_from_firestore.py'
      - 'firebase_client.py'
      - 'models.py'
      - 'state_manager.py'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and push image via Cloud Build
        run: |-
          gcloud builds submit . --config=cloudbuild-bot.yaml

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy trading-bot-service \
            --image europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trading-bot-image/trading-bot-service:latest \
            --region europe-central2 \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector trading-bot-vpc \
            --vpc-egress all \
            --service-account trading-bot-463318@appspot.gserviceaccount.com
