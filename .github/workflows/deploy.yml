name: Deploy Trading Bot to Cloud Run

on:
  push:
    branches:
      - div
    paths:
      - '.github/workflows/deploy.yml'
      - 'cloudbuild-bot.yaml'
      - 'bot_service/**'
      - 'shared_lib/**'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # --- NOWA, UPROSZCZONA AUTENTYKACJA ---
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          # Nie podajemy 'service_account', bo uprawnienia są nadane bezpośrednio

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}' # Jawne ustawienie projektu

      - name: Build and push image via Cloud Build
        run: gcloud builds submit . --config=cloudbuild-bot.yaml

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy trading-bot-service \
            --image europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trading-bot-image/trading-bot-service:latest \
            --region europe-central2 \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector app-connector-warsaw \
            --vpc-egress all \
            --service-account trading-bot-463318@appspot.gserviceaccount.com