#trading_bot/cloudbuild-bot.yaml
steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'europe-central2-docker.pkg.dev/${PROJECT_ID}/trading-bot-image/trading-bot-service:latest',
    
    # --- KLUCZOWA ZMIANA ---
    # Wskazujemy na plik Dockerfile w jego nowej lokalizacji wewnątrz katalogu usługi.
    # Pamiętaj, że plik 'Dockerfile.bot' powinien być teraz nazwany 'Dockerfile'.
    '--file', 'bot_service/Dockerfile',

    # Kontekst budowania to wciąż '.', czyli główny katalog repozytorium.
    '.'
  ]
images:
- 'europe-central2-docker.pkg.dev/${PROJECT_ID}/trading-bot-image/trading-bot-service:latest'
