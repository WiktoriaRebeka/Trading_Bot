runtime: python310
service: default
entrypoint: gunicorn -b :$PORT app.main:app # Wskazuje na app/main.py

instance_class: F1
automatic_scaling:
  min_instances: 1
  max_instances: 1

env_variables:
  FETCH_INTERVAL_SECONDS: "60"
  BOT_LOOP_INTERVAL_SECONDS: "15"
  # Upewnij się, że żadne inne zmienne nie są absolutnie krytyczne dla samego startu