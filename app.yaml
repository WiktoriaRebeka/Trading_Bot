runtime: python310
service: test-service 
instance_class: F1
entrypoint: python hello_app.py

automatic_scaling:
  min_instances: 1
  max_instances: 1

# Dodaj te sekcje:
liveness_check:
  path: "/liveness_check"  # App Engine będzie próbował tego endpointu, ale go nie znajdzie
  check_interval_sec: 300
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 1
  initial_delay_sec: 300 # Daj więcej czasu na start

readiness_check:
  path: "/readiness_check" # App Engine będzie próbował tego endpointu, ale go nie znajdzie
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 1
  app_start_timeout_sec: 300 # Zwiększ timeout na start aplikacji