runtime: python310
service: default 
instance_class: F1
entrypoint: gunicorn -b :$PORT app.main:flask_app

automatic_scaling:
  min_instances: 1
  max_instances: 1

liveness_check:
  path: "/"
  # initial_delay_sec: 300  # USUWAMY TĘ LINIĘ
  check_interval_sec: 30
  timeout_sec: 10        
  failure_threshold: 10  
  success_threshold: 1

readiness_check:
  path: "/" 
  # initial_delay_sec: 300  # USUWAMY TĘ LINIĘ
  check_interval_sec: 30
  timeout_sec: 10
  failure_threshold: 10
  app_start_timeout_sec: 600 # Dajemy aplikacji 10 minut na osiągnięcie stanu "gotowości"

  