# Lokalizacja: /cloudbuild-collector.yaml
# WERSJA POPRAWIONA

steps:
# Krok 1: Zbuduj obraz Docker
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build Image'
  args: ['build', '-t', 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA', '--file', 'collector_service/Dockerfile', '.']

# Krok 2: Wypchnij obraz do Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push Image'
  args: ['push', 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA']

# Krok 3: Wdróż obraz na Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'data-collector-service'
    - '--image'
    - 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA'
    - '--region'
    - 'europe-central2'
    - '--platform'
    - 'managed'
    - '--service-account'
    - 'trading-bot-463318@appspot.gserviceaccount.com'
    - '--min-instances=0' # Upewniamy się, że skaluje się do zera
    - '--update-secrets'
    - 'BYBIT_API_KEY=bybit-api-key:latest,BYBIT_API_SECRET=bybit-api-secret:latest'

images:
- 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY