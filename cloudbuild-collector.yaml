# Lokalizacja: /cloudbuild-collector.yaml
steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA', '--file', 'collector_service/Dockerfile', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'data-collector-service'
    - '--image'
    - 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA'
    - '--region'
    - 'europe-central2'
    - '--platform'
    - 'managed'
    - '--service-account'
    - 'trading-bot-runner@$PROJECT_ID.iam.gserviceaccount.com'
    # --- OSTATECZNY TEST: Usługi Cloud Run nie mają konfiguracji VPC ---
    # Ta usługa nie miała VPC, więc plik pozostaje bez zmian w tej sekcji,
    # ale upewniamy się, że jest spójny.
images:
- 'europe-central2-docker.pkg.dev/$PROJECT_ID/trading-bot-image/data-collector-service:$SHORT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY